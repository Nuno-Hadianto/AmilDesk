<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzakki - AmilDesk</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="app-container">
        <div id="sidebar-placeholder"></div>
        
        <div class="main-content">
            <div id="header-placeholder"></div>
            
            <div class="content-body">
                <div class="card">
                    <!-- Controls Header -->
                    <div class="table-controls">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" id="search-input" placeholder="Cari nama, alamat, no hp...">
                        </div>
                        <button class="btn btn-primary" id="btn-tambah-muzakki">
                            + Tambah Muzakki
                        </button>
                    </div>
                    
                    <!-- Table Container -->
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">No</th>
                                    <th>Nama Muzakki</th>
                                    <th>Alamat</th>
                                    <th>No. HP</th>
                                    <th style="width: 180px; text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="muzakki-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination footer -->
                    <div class="pagination">
                        <div class="pagination-info" id="pagination-info">Menampilkan 0 - 0 dari 0 data</div>
                        <div class="pagination-buttons">
                            <button class="btn btn-secondary btn-small" id="btn-prev-page" disabled>Sebelumnya</button>
                            <button class="btn btn-secondary btn-small" id="btn-next-page" disabled>Selanjutnya</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="muzakki-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Muzakki</h3>
                <button class="btn-close-modal" id="btn-close-muzakki-modal">&times;</button>
            </div>
            <form id="muzakki-form">
                <div class="modal-body">
                    <input type="hidden" id="muzakki-id">
                    
                    <div class="form-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="no_hp">No. Handphone / WA</label>
                        <input type="text" id="no_hp" class="form-control" placeholder="Contoh: 08123456789">
                    </div>
                    
                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap</label>
                        <textarea id="alamat" class="form-control" placeholder="Masukkan alamat lengkap"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-small" id="btn-cancel-muzakki-modal">Batal</button>
                    <button type="submit" class="btn btn-primary btn-small">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/common.js"></script>
    <script>
        let currentPage = 1;
        const limit = 10;
        let searchKeyword = '';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initial load
            setTimeout(fetchMuzakkiList, 100);
            
            // Search Input handler (Debounced)
            let searchTimeout;
            document.getElementById('search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchKeyword = e.target.value;
                    currentPage = 1;
                    fetchMuzakkiList();
                }, 400);
            });
            
            // Add Muzakki click
            document.getElementById('btn-tambah-muzakki').addEventListener('click', () => {
                openMuzakkiModal();
            });
            
            // Close modal click
            document.getElementById('btn-close-muzakki-modal').addEventListener('click', closeMuzakkiModal);
            document.getElementById('btn-cancel-muzakki-modal').addEventListener('click', closeMuzakkiModal);
            
            // Form submit
            document.getElementById('muzakki-form').addEventListener('submit', handleMuzakkiSubmit);
            
            // Pagination buttons
            document.getElementById('btn-prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchMuzakkiList();
                }
            });
            document.getElementById('btn-next-page').addEventListener('click', () => {
                currentPage++;
                fetchMuzakkiList();
            });
        });
        
        async function fetchMuzakkiList() {
            showLoading(true);
            try {
                const res = await window.api.listMuzakki({
                    page: currentPage,
                    limit: limit,
                    search: searchKeyword
                });
                showLoading(false);
                
                if (res.success) {
                    renderTable(res.data, res.total, res.page, res.totalPages);
                } else {
                    showToast('Gagal memuat muzakki: ' + res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Kesalahan sistem: ' + err.message, 'error');
            }
        }
        
        function renderTable(data, total, page, totalPages) {
            const body = document.getElementById('muzakki-table-body');
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <h3>Data Kosong</h3>
                            <p>Muzakki tidak ditemukan. Klik tombol Tambah Muzakki untuk memasukkan data baru.</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination-info').innerText = 'Menampilkan 0 - 0 dari 0 data';
                document.getElementById('btn-prev-page').disabled = true;
                document.getElementById('btn-next-page').disabled = true;
                return;
            }
            
            const startNum = (page - 1) * limit + 1;
            const endNum = Math.min(page * limit, total);
            
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${startNum + idx}</td>
                    <td style="font-weight: 600;">${row.nama}</td>
                    <td>${row.alamat || '-'}</td>
                    <td>${row.no_hp || '-'}</td>
                    <td style="text-align: center;">
                        <button class="btn btn-secondary btn-small btn-edit" style="margin-right: 4px;" data-id="${row.id}" data-nama="${row.nama}" data-alamat="${row.alamat || ''}" data-nohp="${row.no_hp || ''}">Ubah</button>
                        <button class="btn btn-danger btn-small btn-delete" data-id="${row.id}" data-nama="${row.nama}">Hapus</button>
                    </td>
                `;
                body.appendChild(tr);
            });
            
            // Pagination status
            document.getElementById('pagination-info').innerText = `Menampilkan ${startNum} - ${endNum} dari ${total} data`;
            document.getElementById('btn-prev-page').disabled = page <= 1;
            document.getElementById('btn-next-page').disabled = page >= totalPages;
            
            // Hook buttons
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const ds = e.target.dataset;
                    openMuzakkiModal(ds.id, ds.nama, ds.alamat, ds.nohp);
                });
            });
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const nama = e.target.dataset.nama;
                    showConfirm('Hapus Muzakki', `Apakah Anda yakin ingin menghapus Muzakki "${nama}"? Semua relasi transaksi muzakki ini akan diset kosong.`, async () => {
                        showLoading(true);
                        const result = await window.api.deleteMuzakki(id);
                        showLoading(false);
                        if (result.success) {
                            showToast(`Muzakki "${nama}" berhasil dihapus.`, 'success');
                            fetchMuzakkiList();
                        } else {
                            showToast(result.message, 'error');
                        }
                    });
                });
            });
        }
        
        function openMuzakkiModal(id = '', nama = '', alamat = '', no_hp = '') {
            document.getElementById('muzakki-id').value = id;
            document.getElementById('nama').value = nama;
            document.getElementById('alamat').value = alamat;
            document.getElementById('no_hp').value = no_hp;
            
            if (id) {
                document.getElementById('modal-title').innerText = 'Ubah Data Muzakki';
            } else {
                document.getElementById('modal-title').innerText = 'Tambah Muzakki Baru';
            }
            
            document.getElementById('muzakki-modal').classList.add('open');
        }
        
        function closeMuzakkiModal() {
            document.getElementById('muzakki-modal').classList.remove('open');
            document.getElementById('muzakki-form').reset();
        }
        
        async function handleMuzakkiSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('muzakki-id').value;
            const nama = document.getElementById('nama').value;
            const alamat = document.getElementById('alamat').value;
            const no_hp = document.getElementById('no_hp').value;
            
            showLoading(true);
            try {
                let res;
                if (id) {
                    res = await window.api.updateMuzakki({ id: parseInt(id), nama, alamat, no_hp });
                } else {
                    res = await window.api.createMuzakki({ nama, alamat, no_hp });
                }
                
                showLoading(false);
                if (res.success) {
                    showToast(id ? 'Muzakki berhasil diperbarui.' : 'Muzakki baru berhasil ditambahkan.', 'success');
                    closeMuzakkiModal();
                    fetchMuzakkiList();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Terjadi kesalahan: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
