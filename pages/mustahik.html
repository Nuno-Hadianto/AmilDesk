<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustahik - AmilDesk</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="app-container">
        <div id="sidebar-placeholder"></div>
        
        <div class="main-content">
            <div id="header-placeholder"></div>
            
            <div class="content-body">
                <div class="card">
                    <div class="table-controls">
                        <div style="display: flex; gap: 12px; flex-grow: 1; max-width: 600px;">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <input type="text" id="search-input" placeholder="Cari nama, alamat...">
                            </div>
                            
                            <select id="filter-kategori" class="filter-select">
                                <option value="">Semua Kategori (Asnaf)</option>
                                <option value="Fakir">Fakir</option>
                                <option value="Miskin">Miskin</option>
                                <option value="Amil">Amil</option>
                                <option value="Muallaf">Muallaf</option>
                                <option value="Riqab">Riqab</option>
                                <option value="Gharim">Gharim</option>
                                <option value="Fisabilillah">Fisabilillah</option>
                                <option value="Ibnu Sabil">Ibnu Sabil</option>
                            </select>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-secondary" id="btn-import-excel" style="border-color: var(--border-color);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px; display: inline-block; vertical-align: middle;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                Impor Excel
                            </button>
                            <button class="btn btn-primary" id="btn-tambah-mustahik">
                                + Tambah Mustahik
                            </button>
                        </div>
                    </div>
                    
                    <!-- Table Container -->
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">No</th>
                                    <th>Nama Mustahik</th>
                                    <th>Kategori (Asnaf)</th>
                                    <th>Alamat</th>
                                    <th style="width: 180px; text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="mustahik-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination footer -->
                    <div class="pagination">
                        <div class="pagination-info" id="pagination-info">Menampilkan 0 - 0 dari 0 data</div>
                        <div class="pagination-buttons">
                            <button class="btn btn-secondary btn-small" id="btn-prev-page" disabled>Sebelumnya</button>
                            <button class="btn btn-secondary btn-small" id="btn-next-page" disabled>Selanjutnya</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="mustahik-modal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-title">Tambah Mustahik</h3>
                <button class="btn-close-modal" id="btn-close-mustahik-modal">&times;</button>
            </div>
            <form id="mustahik-form">
                <div class="modal-body">
                    <input type="hidden" id="mustahik-id">
                    
                    <div class="form-group">
                        <label for="nama">Nama Lengkap *</label>
                        <input type="text" id="nama" class="form-control" placeholder="Masukkan nama lengkap" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="kategori">Kategori Asnaf *</label>
                        <select id="kategori" class="form-control" required>
                            <option value="">-- Pilih Kategori --</option>
                            <option value="Fakir">Fakir</option>
                            <option value="Miskin">Miskin</option>
                            <option value="Amil">Amil</option>
                            <option value="Muallaf">Muallaf</option>
                            <option value="Riqab">Riqab</option>
                            <option value="Gharim">Gharim</option>
                            <option value="Fisabilillah">Fisabilillah</option>
                            <option value="Ibnu Sabil">Ibnu Sabil</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="alamat">Alamat Lengkap</label>
                        <textarea id="alamat" class="form-control" placeholder="Masukkan alamat lengkap"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-small" id="btn-cancel-mustahik-modal">Batal</button>
                    <button type="submit" class="btn btn-primary btn-small">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/common.js"></script>
    <script>
        let currentPage = 1;
        const limit = 10;
        let searchKeyword = '';
        let filterKategoriAsnaf = '';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initial load
            setTimeout(fetchMustahikList, 100);
            
            // Search Input handler
            let searchTimeout;
            document.getElementById('search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchKeyword = e.target.value;
                    currentPage = 1;
                    fetchMustahikList();
                }, 400);
            });
            
            // Filter dropdown handler
            document.getElementById('filter-kategori').addEventListener('change', (e) => {
                filterKategoriAsnaf = e.target.value;
                currentPage = 1;
                fetchMustahikList();
            });
            
            // Add click
            document.getElementById('btn-tambah-mustahik').addEventListener('click', () => {
                openMustahikModal();
            });
            
            // Import Excel click
            document.getElementById('btn-import-excel').addEventListener('click', async () => {
                showLoading(true);
                try {
                    const res = await window.api.importMustahikExcel();
                    showLoading(false);
                    if (res.success) {
                        showToast(`Berhasil mengimpor ${res.count} data Mustahik!`, 'success');
                        currentPage = 1;
                        fetchMustahikList();
                    } else {
                        showToast(res.message, res.message.includes('batal') ? 'info' : 'error');
                    }
                } catch (err) {
                    showLoading(false);
                    showToast('Gagal mengimpor Excel: ' + err.message, 'error');
                }
            });
            
            // Close triggers
            document.getElementById('btn-close-mustahik-modal').addEventListener('click', closeMustahikModal);
            document.getElementById('btn-cancel-mustahik-modal').addEventListener('click', closeMustahikModal);
            
            // Form submit
            document.getElementById('mustahik-form').addEventListener('submit', handleMustahikSubmit);
            
            // Pagination buttons
            document.getElementById('btn-prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchMustahikList();
                }
            });
            document.getElementById('btn-next-page').addEventListener('click', () => {
                currentPage++;
                fetchMustahikList();
            });
        });
        
        async function fetchMustahikList() {
            showLoading(true);
            try {
                const res = await window.api.listMustahik({
                    page: currentPage,
                    limit: limit,
                    search: searchKeyword,
                    kategori: filterKategoriAsnaf
                });
                showLoading(false);
                
                if (res.success) {
                    renderTable(res.data, res.total, res.page, res.totalPages);
                } else {
                    showToast('Gagal memuat mustahik: ' + res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Kesalahan sistem: ' + err.message, 'error');
            }
        }
        
        function renderTable(data, total, page, totalPages) {
            const body = document.getElementById('mustahik-table-body');
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <h3>Data Kosong</h3>
                            <p>Mustahik tidak ditemukan. Klik tombol Tambah Mustahik untuk memasukkan data baru.</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination-info').innerText = 'Menampilkan 0 - 0 dari 0 data';
                document.getElementById('btn-prev-page').disabled = true;
                document.getElementById('btn-next-page').disabled = true;
                return;
            }
            
            const startNum = (page - 1) * limit + 1;
            const endNum = Math.min(page * limit, total);
            
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${startNum + idx}</td>
                    <td style="font-weight: 600;">${row.nama}</td>
                    <td><span class="badge badge-green">${row.kategori}</span></td>
                    <td>${row.alamat || '-'}</td>
                    <td style="text-align: center;">
                        <button class="btn btn-secondary btn-small btn-edit" style="margin-right: 4px;" data-id="${row.id}" data-nama="${row.nama}" data-kategori="${row.kategori}" data-alamat="${row.alamat || ''}">Ubah</button>
                        <button class="btn btn-danger btn-small btn-delete" data-id="${row.id}" data-nama="${row.nama}">Hapus</button>
                    </td>
                `;
                body.appendChild(tr);
            });
            
            // Pagination status
            document.getElementById('pagination-info').innerText = `Menampilkan ${startNum} - ${endNum} dari ${total} data`;
            document.getElementById('btn-prev-page').disabled = page <= 1;
            document.getElementById('btn-next-page').disabled = page >= totalPages;
            
            // Hook buttons
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const ds = e.target.dataset;
                    openMustahikModal(ds.id, ds.nama, ds.kategori, ds.alamat);
                });
            });
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const nama = e.target.dataset.nama;
                    showConfirm('Hapus Mustahik', `Apakah Anda yakin ingin menghapus Mustahik "${nama}"? Semua relasi transaksi penyaluran ke mustahik ini akan diset kosong.`, async () => {
                        showLoading(true);
                        const result = await window.api.deleteMustahik(id);
                        showLoading(false);
                        if (result.success) {
                            showToast(`Mustahik "${nama}" berhasil dihapus.`, 'success');
                            fetchMustahikList();
                        } else {
                            showToast(result.message, 'error');
                        }
                    });
                });
            });
        }
        
        function openMustahikModal(id = '', nama = '', kategori = '', alamat = '') {
            document.getElementById('mustahik-id').value = id;
            document.getElementById('nama').value = nama;
            document.getElementById('kategori').value = kategori;
            document.getElementById('alamat').value = alamat;
            
            if (id) {
                document.getElementById('modal-title').innerText = 'Ubah Data Mustahik';
            } else {
                document.getElementById('modal-title').innerText = 'Tambah Mustahik Baru';
            }
            
            document.getElementById('mustahik-modal').classList.add('open');
        }
        
        function closeMustahikModal() {
            document.getElementById('mustahik-modal').classList.remove('open');
            document.getElementById('mustahik-form').reset();
        }
        
        async function handleMustahikSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('mustahik-id').value;
            const nama = document.getElementById('nama').value;
            const kategori = document.getElementById('kategori').value;
            const alamat = document.getElementById('alamat').value;
            
            if (!kategori) {
                showToast('Mohon pilih kategori asnaf.', 'error');
                return;
            }
            
            showLoading(true);
            try {
                let res;
                if (id) {
                    res = await window.api.updateMustahik({ id: parseInt(id), nama, kategori, alamat });
                } else {
                    res = await window.api.createMustahik({ nama, kategori, alamat });
                }
                
                showLoading(false);
                if (res.success) {
                    showToast(id ? 'Mustahik berhasil diperbarui.' : 'Mustahik baru berhasil ditambahkan.', 'success');
                    closeMustahikModal();
                    fetchMustahikList();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Terjadi kesalahan: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
