<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penyaluran Zakat - AmilDesk</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <div class="app-container">
        <div id="sidebar-placeholder"></div>
        
        <div class="main-content">
            <div id="header-placeholder"></div>
            
            <div class="content-body">
                
                <!-- Balance Banner -->
                <div class="card" style="padding: 16px; margin-bottom: 20px; background-color: var(--primary-light); border-color: var(--primary-color);">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <div style="color: var(--primary-dark); font-weight: 700; font-size: 15px;">POSISI SALDO SAAT INI:</div>
                            <div style="background-color: var(--bg-card); padding: 6px 12px; border-radius: 6px; font-weight: 600; border: 1px solid var(--border-color); color: var(--text-primary);">
                                Kas Uang: <span id="banner-saldo-uang" style="color: var(--primary-dark); font-weight: 700;">Rp0</span>
                            </div>
                            <div style="background-color: var(--bg-card); padding: 6px 12px; border-radius: 6px; font-weight: 600; border: 1px solid var(--border-color); color: var(--text-primary);">
                                Stok Beras: <span id="banner-saldo-beras" style="color: var(--primary-dark); font-weight: 700;">0 kg</span>
                            </div>
                        </div>
                        <button class="btn btn-secondary btn-small" id="btn-refresh-balances" style="background-color: var(--bg-card);">Refresh Saldo</button>
                    </div>
                </div>

                <div class="card">
                    <!-- Controls Header -->
                    <div class="table-controls">
                        <div style="display: flex; gap: 12px; flex-grow: 1; max-width: 600px;">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                <input type="text" id="search-input" placeholder="Cari nama mustahik, keterangan...">
                            </div>
                            
                            <select id="filter-jenis" class="filter-select">
                                <option value="">Semua Jenis Zakat</option>
                                <option value="Zakat Fitrah">Zakat Fitrah</option>
                                <option value="Zakat Mal">Zakat Mal</option>
                                <option value="Infaq">Infaq</option>
                                <option value="Sedekah">Sedekah</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" id="btn-tambah-distribusi">
                            + Catat Penyaluran Zakat
                        </button>
                    </div>
                    
                    <!-- Table Container -->
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width: 80px;">No</th>
                                    <th>Tanggal</th>
                                    <th>Penerima (Mustahik)</th>
                                    <th>Kategori (Asnaf)</th>
                                    <th>Jenis Zakat</th>
                                    <th style="text-align: right;">Jumlah Uang</th>
                                    <th style="text-align: right;">Jumlah Beras</th>
                                    <th>Keterangan</th>
                                    <th style="width: 150px; text-align: center;">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="distribusi-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Pagination footer -->
                    <div class="pagination">
                        <div class="pagination-info" id="pagination-info">Menampilkan 0 - 0 dari 0 data</div>
                        <div class="pagination-buttons">
                            <button class="btn btn-secondary btn-small" id="btn-prev-page" disabled>Sebelumnya</button>
                            <button class="btn btn-secondary btn-small" id="btn-next-page" disabled>Selanjutnya</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div class="modal-overlay" id="distribusi-modal">
        <div class="modal-container" style="width: 580px;">
            <div class="modal-header">
                <h3 id="modal-title">Catat Penyaluran Zakat</h3>
                <button class="btn-close-modal" id="btn-close-distribusi-modal">&times;</button>
            </div>
            <form id="distribusi-form">
                <div class="modal-body">
                    <input type="hidden" id="distribusi-id">
                    
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="tanggal">Tanggal Penyaluran *</label>
                            <input type="date" id="tanggal" class="form-control" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="jenis_zakat">Jenis Zakat Disalurkan *</label>
                            <select id="jenis_zakat" class="form-control" required>
                                <option value="Zakat Fitrah">Zakat Fitrah</option>
                                <option value="Zakat Mal">Zakat Mal</option>
                                <option value="Infaq">Infaq</option>
                                <option value="Sedekah">Sedekah</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="mustahik_id">Pilih Mustahik (Penerima) *</label>
                        <div style="display: flex; gap: 8px;">
                            <select id="mustahik_id" class="form-control" style="flex-grow: 1;" required>
                                <!-- Populated dynamically -->
                            </select>
                            <button type="button" class="btn btn-secondary btn-small" id="btn-quick-add-mustahik" style="padding: 10px; height: 38px;">
                                + Baru
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="paket_distribusi">Paket Penyaluran Otomatis (Opsional)</label>
                        <select id="paket_distribusi" class="form-control">
                            <option value="">-- Isi Manual (Kustom) --</option>
                            <option value="paket_a">Paket A (Uang Rp100.000 & Beras 5 kg)</option>
                            <option value="paket_b">Paket B (Uang Rp50.000 & Beras 3 kg)</option>
                            <option value="paket_c">Paket C (Hanya Beras 5 kg)</option>
                            <option value="paket_d">Paket D (Hanya Beras 2.5 kg)</option>
                            <option value="paket_e">Paket E (Hanya Uang Rp100.000)</option>
                        </select>
                    </div>
                    
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="jumlah_uang">Jumlah Uang (Rp)</label>
                            <input type="number" id="jumlah_uang" class="form-control" min="0" value="0">
                        </div>
                        
                        <div class="form-group">
                            <label for="jumlah_beras">Jumlah Beras (kg)</label>
                            <input type="number" id="jumlah_beras" class="form-control" min="0" step="0.1" value="0">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="keterangan">Keterangan / Catatan Penyaluran</label>
                        <textarea id="keterangan" class="form-control" placeholder="Contoh: Penyaluran beras zakat fitrah asnaf fakir miskin, santunan anak yatim dll."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-small" id="btn-cancel-distribusi-modal">Batal</button>
                    <button type="submit" class="btn btn-primary btn-small">Simpan Penyaluran</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Quick Add Mustahik Modal -->
    <div class="modal-overlay" id="quick-mustahik-modal" style="z-index: 1100;">
        <div class="modal-container" style="width: 400px; margin-top: 50px;">
            <div class="modal-header">
                <h3>Tambah Mustahik Cepat</h3>
                <button type="button" class="btn-close-modal" id="btn-close-quick-mustahik">&times;</button>
            </div>
            <form id="quick-mustahik-form">
                <div class="modal-body">
                    <div class="form-group">
                        <label for="quick-nama">Nama Lengkap *</label>
                        <input type="text" id="quick-nama" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="quick-kategori">Kategori Asnaf *</label>
                        <select id="quick-kategori" class="form-control" required>
                            <option value="Fakir">Fakir</option>
                            <option value="Miskin">Miskin</option>
                            <option value="Amil">Amil</option>
                            <option value="Muallaf">Muallaf</option>
                            <option value="Riqab">Riqab</option>
                            <option value="Gharim">Gharim</option>
                            <option value="Fisabilillah">Fisabilillah</option>
                            <option value="Ibnu Sabil">Ibnu Sabil</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="quick-alamat">Alamat</label>
                        <textarea id="quick-alamat" class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-small" id="btn-cancel-quick-mustahik">Batal</button>
                    <button type="submit" class="btn btn-primary btn-small">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/common.js"></script>
    <script>
        let currentPage = 1;
        const limit = 10;
        let searchKeyword = '';
        let filterJenisZakat = '';
        
        document.addEventListener('DOMContentLoaded', () => {
            // Initial load
            setTimeout(() => {
                fetchDistribusiList();
                loadBalances();
                loadMustahikDropdown();
            }, 100);
            
            // Refresh balances manual button
            document.getElementById('btn-refresh-balances').addEventListener('click', loadBalances);
            
            // Search Input handler
            let searchTimeout;
            document.getElementById('search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchKeyword = e.target.value;
                    currentPage = 1;
                    fetchDistribusiList();
                }, 400);
            });
            
            // Filter dropdown handler
            document.getElementById('filter-jenis').addEventListener('change', (e) => {
                filterJenisZakat = e.target.value;
                currentPage = 1;
                fetchDistribusiList();
            });
            
            // Add click
            document.getElementById('btn-tambah-distribusi').addEventListener('click', () => {
                openDistribusiModal();
            });
            
            // Close triggers
            document.getElementById('btn-close-distribusi-modal').addEventListener('click', closeDistribusiModal);
            document.getElementById('btn-cancel-distribusi-modal').addEventListener('click', closeDistribusiModal);
            
            // Form submit
            document.getElementById('distribusi-form').addEventListener('submit', handleDistribusiSubmit);
            
            // Quick Add Mustahik actions
            document.getElementById('btn-quick-add-mustahik').addEventListener('click', () => {
                document.getElementById('quick-mustahik-modal').classList.add('open');
            });
            document.getElementById('btn-close-quick-mustahik').addEventListener('click', () => {
                document.getElementById('quick-mustahik-modal').classList.remove('open');
            });
            document.getElementById('btn-cancel-quick-mustahik').addEventListener('click', () => {
                document.getElementById('quick-mustahik-modal').classList.remove('open');
            });
            document.getElementById('quick-mustahik-form').addEventListener('submit', handleQuickMustahikSubmit);
            
            // Hook Packet Distribution selection
            document.getElementById('paket_distribusi').addEventListener('change', (e) => {
                const val = e.target.value;
                const uangInput = document.getElementById('jumlah_uang');
                const berasInput = document.getElementById('jumlah_beras');
                const ketInput = document.getElementById('keterangan');
                
                if (val === 'paket_a') {
                    uangInput.value = 100000;
                    berasInput.value = 5;
                    ketInput.value = 'Penyaluran Paket A (Uang Rp100rb & Beras 5kg)';
                } else if (val === 'paket_b') {
                    uangInput.value = 50000;
                    berasInput.value = 3;
                    ketInput.value = 'Penyaluran Paket B (Uang Rp50rb & Beras 3kg)';
                } else if (val === 'paket_c') {
                    uangInput.value = 0;
                    berasInput.value = 5;
                    ketInput.value = 'Penyaluran Paket C (Beras 5kg)';
                } else if (val === 'paket_d') {
                    uangInput.value = 0;
                    berasInput.value = 2.5;
                    ketInput.value = 'Penyaluran Paket D (Beras 2.5kg)';
                } else if (val === 'paket_e') {
                    uangInput.value = 100000;
                    berasInput.value = 0;
                    ketInput.value = 'Penyaluran Paket E (Uang Rp100rb)';
                }
            });
            
            // Pagination buttons
            document.getElementById('btn-prev-page').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchDistribusiList();
                }
            });
            document.getElementById('btn-next-page').addEventListener('click', () => {
                currentPage++;
                fetchDistribusiList();
            });
        });
        
        async function loadBalances() {
            try {
                const res = await window.api.getBalances();
                if (res.success) {
                    document.getElementById('banner-saldo-uang').innerText = formatIDR(res.balances.uang);
                    document.getElementById('banner-saldo-beras').innerText = formatBeras(res.balances.beras);
                }
            } catch (err) {
                console.error("Load balance banner error:", err);
            }
        }
        
        async function loadMustahikDropdown() {
            try {
                const res = await window.api.listMustahik({ page: 1, limit: 500, search: '' });
                if (res.success) {
                    const select = document.getElementById('mustahik_id');
                    select.innerHTML = '<option value="">-- Pilih Mustahik --</option>';
                    res.data.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.innerText = `${m.nama} [Asnaf ${m.kategori}]` + (m.alamat ? ` - ${m.alamat}` : '');
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Dropdown error:", err);
            }
        }
        
        async function fetchDistribusiList() {
            showLoading(true);
            try {
                const res = await window.api.listDistribusi({
                    page: currentPage,
                    limit: limit,
                    search: searchKeyword,
                    jenis: filterJenisZakat
                });
                showLoading(false);
                
                if (res.success) {
                    renderTable(res.data, res.total, res.page, res.totalPages);
                } else {
                    showToast('Gagal memuat distribusi: ' + res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Kesalahan sistem: ' + err.message, 'error');
            }
        }
        
        function renderTable(data, total, page, totalPages) {
            const body = document.getElementById('distribusi-table-body');
            body.innerHTML = '';
            
            if (data.length === 0) {
                body.innerHTML = `
                    <tr>
                        <td colspan="9" class="empty-state">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            <h3>Distribusi Kosong</h3>
                            <p>Belum ada pencatatan penyaluran zakat. Klik tombol Catat Penyaluran Zakat untuk memulai.</p>
                        </td>
                    </tr>
                `;
                document.getElementById('pagination-info').innerText = 'Menampilkan 0 - 0 dari 0 data';
                document.getElementById('btn-prev-page').disabled = true;
                document.getElementById('btn-next-page').disabled = true;
                return;
            }
            
            const startNum = (page - 1) * limit + 1;
            const endNum = Math.min(page * limit, total);
            
            data.forEach((row, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${startNum + idx}</td>
                    <td>${formatDate(row.tanggal)}</td>
                    <td style="font-weight: 600;">${row.mustahik_nama || '<span style="color: var(--text-light)">Umum/Bukan Mustahik</span>'}</td>
                    <td><span class="badge badge-green">${row.mustahik_kategori || 'Umum'}</span></td>
                    <td><span class="badge ${getBadgeClass(row.jenis_zakat)}">${row.jenis_zakat}</span></td>
                    <td style="text-align: right; font-weight: 600; font-variant-numeric: tabular-nums;">${row.jumlah_uang > 0 ? formatIDR(row.jumlah_uang) : '-'}</td>
                    <td style="text-align: right; font-weight: 600; font-variant-numeric: tabular-nums;">${row.jumlah_beras > 0 ? formatBeras(row.jumlah_beras) : '-'}</td>
                    <td>${row.keterangan || '-'}</td>
                    <td style="text-align: center;">
                        <button class="btn btn-secondary btn-small btn-edit" style="margin-right: 4px;" 
                            data-id="${row.id}" 
                            data-tanggal="${row.tanggal}" 
                            data-mustahik="${row.mustahik_id}" 
                            data-jenis="${row.jenis_zakat}" 
                            data-uang="${row.jumlah_uang}" 
                            data-beras="${row.jumlah_beras}" 
                            data-ket="${row.keterangan || ''}">Ubah</button>
                        <button class="btn btn-danger btn-small btn-delete" data-id="${row.id}" data-mustahik="${row.mustahik_nama || 'Umum'}">Hapus</button>
                    </td>
                `;
                body.appendChild(tr);
            });
            
            document.getElementById('pagination-info').innerText = `Menampilkan ${startNum} - ${endNum} dari ${total} data`;
            document.getElementById('btn-prev-page').disabled = page <= 1;
            document.getElementById('btn-next-page').disabled = page >= totalPages;
            
            // Hook buttons
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const ds = e.target.dataset;
                    openDistribusiModal(ds.id, ds.tanggal, ds.mustahik, ds.jenis, ds.uang, ds.beras, ds.ket);
                });
            });
            
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const mustahik = e.target.dataset.mustahik;
                    showConfirm('Hapus Distribusi', `Apakah Anda yakin ingin menghapus catatan penyaluran zakat ke "${mustahik}"? Saldo kas/beras akan disesuaikan kembali secara otomatis.`, async () => {
                        showLoading(true);
                        const result = await window.api.deleteDistribusi(id);
                        showLoading(false);
                        if (result.success) {
                            showToast(`Catatan distribusi berhasil dihapus.`, 'success');
                            fetchDistribusiList();
                            loadBalances();
                        } else {
                            showToast(result.message, 'error');
                        }
                    });
                });
            });
        }
        
        function getBadgeClass(type) {
            switch(type) {
                case 'Zakat Fitrah': return 'badge-green';
                case 'Zakat Mal': return 'badge-blue';
                case 'Infaq': return 'badge-orange';
                case 'Sedekah': return 'badge-orange';
                default: return 'badge-secondary';
            }
        }
        
        function openDistribusiModal(id = '', tanggal = '', mustahik_id = '', jenis_zakat = 'Zakat Fitrah', jumlah_uang = 0, jumlah_beras = 0, keterangan = '') {
            document.getElementById('distribusi-id').value = id;
            
            // Default date to today
            if (!tanggal) {
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');
                tanggal = `${yyyy}-${mm}-${dd}`;
            }
            
            document.getElementById('tanggal').value = tanggal;
            document.getElementById('mustahik_id').value = mustahik_id;
            document.getElementById('jenis_zakat').value = jenis_zakat;
            document.getElementById('jumlah_uang').value = jumlah_uang;
            document.getElementById('jumlah_beras').value = jumlah_beras;
            document.getElementById('keterangan').value = keterangan;
            
            // Reset paket dropdown
            document.getElementById('paket_distribusi').value = '';
            
            if (id) {
                document.getElementById('modal-title').innerText = 'Ubah Distribusi Zakat';
            } else {
                document.getElementById('modal-title').innerText = 'Catat Penyaluran Zakat Baru';
            }
            
            document.getElementById('distribusi-modal').classList.add('open');
        }
        
        function closeDistribusiModal() {
            document.getElementById('distribusi-modal').classList.remove('open');
            document.getElementById('distribusi-form').reset();
        }
        
        async function handleDistribusiSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('distribusi-id').value;
            const tanggal = document.getElementById('tanggal').value;
            const mustahik_id = parseInt(document.getElementById('mustahik_id').value);
            const jenis_zakat = document.getElementById('jenis_zakat').value;
            const jumlah_uang = parseFloat(document.getElementById('jumlah_uang').value) || 0;
            const jumlah_beras = parseFloat(document.getElementById('jumlah_beras').value) || 0;
            const keterangan = document.getElementById('keterangan').value;
            
            if (!mustahik_id) {
                showToast('Mohon pilih mustahik.', 'error');
                return;
            }
            if (jumlah_uang === 0 && jumlah_beras === 0) {
                showToast('Jumlah uang atau beras wajib diisi salah satu.', 'error');
                return;
            }
            
            showLoading(true);
            try {
                let res;
                const payload = { tanggal, mustahik_id, jenis_zakat, jumlah_uang, jumlah_beras, keterangan };
                if (id) {
                    res = await window.api.updateDistribusi({ id: parseInt(id), ...payload });
                } else {
                    res = await window.api.createDistribusi(payload);
                }
                
                showLoading(false);
                if (res.success) {
                    showToast(id ? 'Distribusi berhasil diperbarui.' : 'Data penyaluran zakat berhasil disimpan.', 'success');
                    closeDistribusiModal();
                    fetchDistribusiList();
                    loadBalances();
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Terjadi kesalahan: ' + err.message, 'error');
            }
        }
        
        async function handleQuickMustahikSubmit(e) {
            e.preventDefault();
            
            const nama = document.getElementById('quick-nama').value;
            const kategori = document.getElementById('quick-kategori').value;
            const alamat = document.getElementById('quick-alamat').value;
            
            showLoading(true);
            try {
                const res = await window.api.createMustahik({ nama, kategori, alamat });
                showLoading(false);
                
                if (res.success) {
                    showToast('Mustahik baru berhasil ditambahkan.', 'success');
                    document.getElementById('quick-mustahik-modal').classList.remove('open');
                    document.getElementById('quick-mustahik-form').reset();
                    
                    // Reload dropdown and select the newly added mustahik
                    await loadMustahikDropdown();
                    document.getElementById('mustahik_id').value = res.id;
                } else {
                    showToast(res.message, 'error');
                }
            } catch (err) {
                showLoading(false);
                showToast('Gagal menyimpan mustahik: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
